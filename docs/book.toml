[book]
authors = ["Jeffrey D. Mitchell"]
language = "en"
src = "src"
title = "Yew SSG Documentation"
description = "Documentation for the Yew Static Site Generator"

[build]
build-dir = "book"
create-missing = true

[output.html]
default-theme = "rust"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/crustyrustacean/yew-ssg"
edit-url-template = "https://github.com/crustyrustacean/yew-ssg/edit/main/docs/{path}"

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true

[package]
name = "taxus-client"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true

[[bin]]
name = "client"
path = "src/main.rs"
# This crate is a wasm32-only artifact (see build.rs in taxus-generator):
# its entry point is #[wasm_bindgen] hydrate_islands(), invoked by the JS
# shim — not a host `main`. Building a host test harness for it fails at
# link time on Windows (LNK1561: entry point must be defined) because
# #![no_main] leaves the generated harness exe without an entry point.
# Host correctness is covered by `cargo check` and the wasm-check CI job
# (wasm32-unknown-unknown); the crate's logic is unit-tested in
# taxus-common, which is host-testable.
test = false
bench = false

[dependencies]
js-sys = "0.3"
taxus-common = { path = "../taxus-common" }
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console", "Document", "Window", "HtmlElement", "DomStringMap", "NodeList", "Element"] }
yew = { version = "0.23", features = [ "hydration" ] }

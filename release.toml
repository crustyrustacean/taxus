allow-branch = ["trunk"]
sign-commit = false
sign-tag = false
publish = false
push = false
tag = true
pre-release-commit-message = "chore: release v{{version}}"
tag-message = "v{{version}}"
tag-name = "v{{version}}"
# The changelog is written by hand under `## [Unreleased]` as work lands;
# releasing promotes that section to `## [{{version}}] - <date>`. The hook
# runs from a crate directory, not the workspace root, which is why it
# goes through `cargo xtask` (the alias resolves anywhere in the
# workspace and the command locates CHANGELOG.md itself). It is a no-op
# when the version's section already exists, so it is safe if cargo-release
# runs it more than once.
pre-release-hook = ["cargo", "xtask", "changelog", "--version", "{{version}}"]

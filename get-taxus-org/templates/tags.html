{% extends "base.html" %}

{% block title %}Tags - {{ site.name }}{% endblock %}

{% block content %}
<article class="section-content">
  <h2>Tags</h2>
  {% if extra.taxonomy.terms %}
  <nav class="section-pages" aria-label="tags">
    {% for term in extra.taxonomy.terms %}
    <a href="{{ term.path }}">
      <span class="section-page-title">{{ term.name }}</span>
      <span class="section-page-desc">{{ term.page_count }} post(s)</span>
    </a>
    {% endfor %}
  </nav>
  {% else %}
  <p>No tags yet.</p>
  {% endif %}
</article>
{% endblock %}

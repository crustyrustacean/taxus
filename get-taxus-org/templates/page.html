{% extends "base.html" %}

{% block title %}{{ page.title }} - {{ site.name }}{% endblock %}

{% block content %}
<article class="section-content">

  <h2>{{ page.date }}</h2>

  <h2>{{ page.title }}</h2>

   {% if page.description %}
  <p class="description">{{ page.description }}</p>
  {% endif %}

  {{ page.content | safe }}

</article>
{% endblock %}

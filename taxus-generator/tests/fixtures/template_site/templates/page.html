{% extends "base.html" %}

{% block title %}{{ page.title }} - {{ site.name }}{% endblock %}

{% block content %}
<article>
    <h1>{{ page.title }}</h1>
    {% if page.description %}
    <p class="description">{{ page.description }}</p>
    {% endif %}
    {% if page.date %}
    <time datetime="{{ page.date }}">{{ page.date }}</time>
    {% endif %}
    <div class="content">
        {{ page.content | safe }}
    </div>
</article>
{% endblock %}

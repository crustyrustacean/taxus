[package]
name = "taxus-ssg"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
authors.workspace = true
description = "A reusable Rust static site generator library."
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage = "https://get-taxus.org"
documentation = "https://docs.rs/taxus-ssg"
keywords = ["static-site-generator", "ssg", "markdown", "tera", "wasm"]
categories = ["command-line-utilities", "web-programming"]
publish = true

[lib]
name = "taxus_lib"
path = "src/lib.rs"

[features]
# Syntax-highlighting grammars. All default-on: a new site should get
# working highlighting for the languages it most likely contains
# without the author discovering a feature flag first. Each is optional
# so a distributor can trim the binary (`--no-default-features` plus
# the features it wants).
lang-rust = ["dep:tree-sitter-rust"]
lang-html = ["dep:tree-sitter-html"]
lang-css = ["dep:tree-sitter-css"]
lang-javascript = ["dep:tree-sitter-javascript"]
# Lossy WebP encoding via libwebp (the `webp` crate). Without this feature
# WebP output falls back to the `image` crate's lossless encoder and
# `images.quality` is ignored for WebP.
webp-lossy = ["dep:webp"]
# Embedded WASM client generation is enabled for the standalone product build;
# library consumers can disable it with --no-default-features.
embedded-wasm = []
# Native TypeScript compiler archives are opt-in: default Taxus binaries do
# not carry any compiler. Enable this feature when building a binary that
# should compile TypeScript without an external `tsc`.
typescript = ["dep:flate2", "dep:tar"]
default = [
    "embedded-wasm",
    "lang-rust",
    "lang-html",
    "lang-css",
    "lang-javascript",
    "webp-lossy",
]

[dependencies]
deunicode = "1"
# ── Core SSG dependencies (always compiled) ──────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }
grass = "0.13"
pulldown-cmark = "0.13"
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
tera = "2"
thiserror = "2"
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1"
tracing = "0.1"
tree-sitter = "0.26"
tree-sitter-highlight = "0.26"
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
tree-sitter-css = { version = "0.25", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
walkdir = "2.5"
image = "0.25"
webp = { version = "0.3.1", optional = true }

# ── Islands (Yew SSR + WASM client) ───────────────────────────────────────────
taxus-common = { version = "1.4", path = "../taxus-common" }
taxus-domain = { version = "1.4", path = "../taxus-domain" }
yew = { version = "0.23", features = ["ssr"] }

# ── Asset and optional compiler dependencies ──────────────────────────────────
tera-contrib = { version = "0.2.0", features = ["date", "slug"] }
notify = "8.2"
sha2 = "0.10"
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }

[build-dependencies]
wasm-bindgen-cli-support = "=0.2.126"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.50", features = ["test-util"] }
tokio-tungstenite = "0.29"
quick-xml = "0.42"

[package]
name = "taxus"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true

[[bin]]
name = "taxus"
path = "src/bin/taxus/main.rs"

[lib]
name = "taxus_lib"
path = "src/lib.rs"

[features]
lang-rust = ["dep:tree-sitter-rust"]
default = ["lang-rust"]

[dependencies]
# ── Core SSG dependencies (always compiled) ──────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
grass = "0.13"
pulldown-cmark = "0.13"
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
tera = "2"
thiserror = "2"
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "signal"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.26"
tree-sitter-highlight = "0.26"
tree-sitter-rust = { version = "0.24", optional = true }
walkdir = "2.5"
image = "0.25"

# ── Islands (Yew SSR + WASM client) ───────────────────────────────────────────
taxus-common = { path = "../taxus-common" }
yew = { version = "0.23", features = ["ssr"] }

# ── Dev server dependencies ───────────────────────────────────────────────────
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.12", features = ["typed-header"] }
futures-util = "0.3"
http-body-util = "0.1"
notify = "8.2"
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "set-header"] }
tokio-stream = "0.1"
webbrowser = "1.0"
tera-contrib = { version = "0.2.0", features = ["date", "slug"] }

[build-dependencies]
wasm-bindgen-cli-support = "=0.2.126"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.13", features = ["json"] }
tokio-tungstenite = "0.29"

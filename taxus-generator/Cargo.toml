[package]
name = "taxus"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true

[[bin]]
name = "taxus"
path = "src/bin/taxus/main.rs"

[lib]
name = "taxus_lib"
path = "src/lib.rs"

[features]
# Enable Yew SSR island support.
# When enabled: the `island()` Tera function renders Yew components server-side
# and the `common` crate and `yew/ssr` are compiled in.
# Without this feature the generator is a plain Tera + Markdown SSG with no
# Yew/WASM dependency, and `island()` calls in templates produce empty output.
islands = ["dep:taxus-common", "dep:yew", "dep:wasm-bindgen-cli-support"]
lang-rust = ["dep:tree-sitter-rust"]
default = ["islands", "lang-rust"]

[dependencies]
# ── Core SSG dependencies (always compiled) ──────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
grass = "0.13.4"
pulldown-cmark = "0.13.1"
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
tera = "1.20"
thiserror = "2.0"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "signal"] }
toml = "1.0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.26.8"
tree-sitter-highlight = "0.26.8"
tree-sitter-rust = { version = "0.24.2", optional = true }
walkdir = "2.5"
image = "0.25"

# ── Dev server dependencies ───────────────────────────────────────────────────
axum = { version = "0.8.8", features = ["ws"] }
axum-extra = { version = "0.12.5", features = ["typed-header"] }
futures-util = "0.3"
http-body-util = "0.1"
notify = "8.2.0"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tokio-stream = "0.1"
webbrowser = "1.0"

# ── Islands feature dependencies (compiled only with --features islands) ──────
taxus-common = { path = "../taxus-common", optional = true }
yew = { version = "0.23.0", features = ["ssr"], optional = true }

[build-dependencies]
wasm-bindgen-cli-support = { version = "=0.2.118", optional = true }

[dev-dependencies]
tempfile = "3.10"
reqwest = { version = "0.13.2", features = ["json"] }
tokio-tungstenite = "0.29"

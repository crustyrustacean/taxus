[workspace]
members = ["common", "generator", "client"]
default-members = ["generator"]
resolver = "3"

[workspace.package]
version = "0.1.33"
edition = "2024"
authors = ["Jeff Mitchell"]
description = "A workspace for a Rust based static site generator, using Tera and Yew."
license = "MIT"
readme = "README.md"
repository = "https://github.com/example/yew-ssg.git"
publish = false

[workspace.dependencies]
serde = { version = "1.0.228", features = [ "derive" ] }

[profile.release]
lto = true         
codegen-units = 1   
strip = false      
panic = "abort"     

[profile.dev]
debug = true        

[profile.dev.package."*"]
opt-level = 2

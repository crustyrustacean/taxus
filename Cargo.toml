[workspace]
members = [
    "taxus-cli",
    "taxus-client",
    "taxus-common",
    "taxus-domain",
    "taxus-generator",
    "taxus-typescript-darwin-arm64",
    "taxus-typescript-darwin-x64",
    "taxus-typescript-linux-arm64",
    "taxus-typescript-linux-x64",
    "taxus-typescript-win32-arm64",
    "taxus-typescript-win32-x64",
    "xtask",
]
default-members = ["taxus-domain", "taxus-generator", "taxus-cli"]
resolver = "3"

[workspace.package]
version = "1.4.5"
rust-version = "1.90"
edition = "2024"
authors = ["Jeff Mitchell"]
description = "A Rust based static site generator, founded in Tera and Yew."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/crustyrustacean/taxus.git"
publish = false

[workspace.dependencies]
serde = { version = "1", features = [ "derive" ] }

[profile.release]
lto = true
codegen-units = 1
strip = false
panic = "abort"

[profile.dev]
debug = true

[profile.dev.package."*"]
opt-level = 2

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

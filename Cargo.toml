[workspace]
members = ["taxus-client", "taxus-common", "taxus-generator", "xtask"]
default-members = ["taxus-generator"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["Jeff Mitchell"]
description = "A Rust based static site generator, founded in Tera and Yew."
license = "MIT"
readme = "README.md"
repository = "https://codeberg.org/crustyrustacean/taxus.git"
publish = false

[workspace.dependencies]
serde = { version = "1.0.228", features = [ "derive" ] }

[profile.release]
lto = true         
codegen-units = 1   
strip = false      
panic = "abort"     

[profile.dev]
debug = true        

[profile.dev.package."*"]
opt-level = 2

[workspace]
members = ["common", "generator", "client"]
default-members = ["generator"]
resolver = "3"

[workspace.package]
version = "0.1.8"
edition = "2024"
authors = ["Jeff Mitchell"]
description = "A Rust workspace for a Yew based static site generator"
license = "MIT"
readme = "README.md"
repository = "https://github.com/example/yew-ssg.git"
publish = false

[workspace.dependencies]
serde = { version = "1.0.228", features = [ "derive" ] }

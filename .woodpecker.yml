# Woodpecker CI — build docs and deploy to Codeberg Pages.
#
# Triggered on pushes to `trunk` that touch the docs or this workflow.
# Builds the mdBook with the pinned 0.5.x version and force-pushes the
# rendered output to the `pages` branch, which Codeberg Pages serves at
# https://crustyrustacean.codeberg.page/taxus/
#
# Required secret (set in Codeberg repo → Settings → CI/CD → Secrets):
#   SSH_DEPLOY_KEY  — private key for a deploy key that has write access
#                     to the `pages` branch. Generate with:
#                       ssh-keygen -t ed25519 -f docs_deploy -N ""
#                     Add docs_deploy.pub as a repository deploy key
#                     (Settings → Deploy keys) with write access.

when:
  branch: trunk
  event: push
  path:
    include:
      - docs/**
      - .woodpecker.yml

# Pinned toolchain — keep in sync with local toolchain guidance in
# docs/src/development.md. mdBook 0.5.x uses hashed asset names and a
# newer theme; this is the canonical version for these docs.
# Update by changing MDBOOK_VERSION below.
# Last updated: 2026-07-05 to mdBook v0.5.3.

steps:
  build-docs:
    image: alpine:3.20
    commands:
      - apk add --no-cache curl tar
      - |
        MDBOOK_VERSION=0.5.3
        curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
          | tar -xz -C /usr/local/bin
      - mdbook --version
      - mdbook build docs/

  deploy-pages:
    image: alpine:3.20
    depends_on: [build-docs]
    commands:
      - apk add --no-cache git openssh
      - mkdir -p ~/.ssh
      - printf '%s\n' "$SSH_DEPLOY_KEY" > ~/.ssh/id_ed25519
      - chmod 600 ~/.ssh/id_ed25519
      - ssh-keyscan -t ed25519 codeberg.org >> ~/.ssh/known_hosts 2>/dev/null
      # Clone the existing pages branch so we preserve history.
      - git clone --branch pages git@codeberg.org:crustyrustacean/taxus.git /tmp/pages
      # Clear the working tree (keep .git) and replace with the fresh build.
      - |
        cd /tmp/pages
        find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
      - cp -r "$CI_WORKSPACE/docs/book/." /tmp/pages/
      - |
        cd /tmp/pages
        git add --all
        git -c user.name="Codeberg Woodpecker" \
            -c user.email="noreply@codeberg.org" \
            commit -m "Deploy docs (mdbook 0.5.x) [skip ci]" || exit 0
        git push origin pages

[package]
name = "yew-ssg"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true

[lib]
name = "yew_ssg_lib"
path = "src/lib.rs"

[[bin]]
name = "yew-ssg"
path = "src/bin/main.rs"

[features]
# Enable Yew SSR island support.
# When enabled: the `island()` Tera function renders Yew components server-side
# and the `common` crate, `yew/ssr`, and `tokio` are compiled in.
# Without this feature the generator is a plain Tera + Markdown SSG with no
# Yew/WASM dependency, and `island()` calls in templates produce empty output.
islands = ["dep:common", "dep:yew", "dep:tokio"]

[dependencies]
# ── Core SSG dependencies (always compiled) ──────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
grass = "0.13.4"
pulldown-cmark = "0.13.1"
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
tera = "1.20"
thiserror = "2.0"
toml = "1.0.6"
walkdir = "2.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── Islands feature dependencies (compiled only with --features islands) ──────
common = { path = "../common", optional = true }
tokio  = { version = "1.50.0", features = ["full"], optional = true }
yew    = { version = "0.23.0", features = ["ssr"], optional = true }

[dev-dependencies]
tempfile = "3.10"

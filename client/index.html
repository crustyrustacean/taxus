<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Yew SSG Client</title>
  </head>
  <body>
    <!-- Trunk replaces this link tag with the compiled WASM loader.
         data-bin disables content hashing so the output is always named
         "client.js" / "client_bg.wasm", matching the <script src="/client.js">
         reference in the Tera base.html template. -->
    <link data-trunk rel="rust" data-wasm-opt="z" data-bin="client" />
  </body>
</html>

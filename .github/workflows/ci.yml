name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature-set:
          - name: default
            flags: ""
          - name: islands
            flags: "--features islands"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.feature-set.name }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets ${{ matrix.feature-set.flags }} -- -D warnings

      - name: Build
        run: cargo build ${{ matrix.feature-set.flags }}

      - name: Run unit and integration tests
        run: cargo test ${{ matrix.feature-set.flags }}

  wasm-check:
    name: WASM Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: Check taxus-common compiles for WASM
        run: cargo check --package taxus-common --target wasm32-unknown-unknown

      - name: Check taxus-client compiles for WASM
        run: cargo check --package taxus-client --target wasm32-unknown-unknown
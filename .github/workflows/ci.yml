name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

env:
  CARGO_TERM_COLOR: always
  # Opt in the build-script staleness test (it shells out to cargo, so a
  # plain `cargo test` must not nest it).
  TAXUS_TEST_BUILD_SCRIPT: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Validate TypeScript compiler archives
        run: python3 scripts/check-typescript-vendor.py

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Clippy with bundled TypeScript
        run: cargo clippy --all-targets --features typescript -- -D warnings

      - name: Build
        run: cargo build

      - name: Check library-only build
        run: cargo check -p taxus-ssg --no-default-features

      - name: Check library-only build dependencies
        run: |
          if cargo tree -p taxus-ssg --no-default-features -e build | grep -q wasm-bindgen-cli-support; then
            echo "wasm-bindgen-cli-support must not be in the library-only build graph"
            exit 1
          fi

      - name: Validate packaged library consumer
        run: python3 scripts/check-packaged-consumer.py

      - name: Run unit and integration tests
        run: cargo test

      - name: Run library-only tests
        run: cargo test -p taxus-ssg --no-default-features --lib

      - name: Verify product golden outputs
        run: cargo test -p taxus-ssg --features embedded-wasm --test golden_output

      - name: Run TypeScript-enabled tests
        run: cargo test --features typescript

      - name: Install Firefox for TypeScript browser smoke test
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      - name: Run TypeScript browser smoke test
        run: scripts/typescript-browser-smoke.sh

      # The same command the deploy workflow runs, against the real
      # binary and CLI, so a change that breaks the product site build
      # fails here rather than on the deploy.
      - name: Build get-taxus.org
        run: |
          cargo run -p taxus-cli --features typescript -- build --dir get-taxus-org --output "$RUNNER_TEMP/get-taxus-org"
          test -f "$RUNNER_TEMP/get-taxus-org/index.html"
          test -f "$RUNNER_TEMP/get-taxus-org/feed.xml"

  wasm-check:
    name: WASM Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: Check taxus-common compiles for WASM
        run: cargo check --package taxus-common --target wasm32-unknown-unknown

      - name: Check taxus-client compiles for WASM
        run: cargo check --package taxus-client --target wasm32-unknown-unknown
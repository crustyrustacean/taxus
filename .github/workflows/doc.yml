name: Docs

on:
  push:
    branches: [trunk]
  # Allow manual deployments from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # Keep MDBOOK_VERSION in step with the mdbook used locally, so CI
      # renders the book the way `mdbook build docs` does on a dev machine.
      - name: Install mdbook
        env:
          MDBOOK_VERSION: v0.5.4
        run: |
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
          mv mdbook /usr/local/bin/
          mdbook --version

      - name: Build docs
        run: mdbook build docs/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4